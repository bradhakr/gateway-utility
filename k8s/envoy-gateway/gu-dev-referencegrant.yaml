# ─────────────────────────────────────────────────────────────────────────────
# ReferenceGrant — gu-dev
#
# Grants the shared-gateway (in the default namespace) permission to:
#   1. Route traffic to the gateway-utility Service in gu-dev
#   2. Read the TLS cert Secret in gu-dev (only needed if using Option B —
#      cert stays in gu-dev namespace rather than being copied to default)
#
# Without this grant, the Envoy Gateway controller will silently reject
# the HTTPRoute backendRef that crosses namespace boundaries.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-shared-gateway
  namespace: gu-dev
  labels:
    app.kubernetes.io/name: gateway-utility
    environment: dev
spec:
  from:
    # Allow the Gateway resource in the default namespace
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: default

  to:
    # Allow routing to any Service in gu-dev
    - group: ""
      kind: Service

    # Allow reading the TLS cert Secret in gu-dev (Option B only)
    # Comment this block out if the cert is copied to the default namespace.
    - group: ""
      kind: Secret
