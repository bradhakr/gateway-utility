# ─────────────────────────────────────────────────────────────────────────────
# HTTPRoute — Gateway Utility (PROD)
#
# Attaches to the shared-gateway wildcard listener (name: https) in the
# default namespace.  The listener hostname *.vks.security.broadcom.com
# covers gu-prod.vks.security.broadcom.com automatically.
#
# Traffic flow:
#   Browser → Envoy (shared-gateway, port 443, TLS terminated)
#             → gateway-utility Service (gu-prod namespace, port 80)
#             → gateway-utility Pod (port 3002)
#
# The OIDC redirectUri in Auth Setup must be:
#   https://gu-prod.vks.security.broadcom.com/auth/callback
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-utility
  namespace: gu-prod
  labels:
    app.kubernetes.io/name: gateway-utility
    environment: prod
spec:
  parentRefs:
    - name: shared-gateway
      namespace: default
      sectionName: https   # name of the wildcard listener in shared-gateway
      group: gateway.networking.k8s.io
      kind: Gateway

  hostnames:
    - gu-prod.vks.security.broadcom.com   # covered by *.vks.security.broadcom.com

  rules:
    # ── Route all traffic to the gateway-utility service ─────────────────────
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway-utility
          namespace: gu-prod
          port: 80
          weight: 1
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
