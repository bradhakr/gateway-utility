# ─────────────────────────────────────────────────────────────────────────────
# Secret — express-session signing key
#
# Generate a strong secret:
#   openssl rand -hex 32
#
# Then base64-encode it for this file:
#   echo -n "<your-hex-secret>" | base64
#
# Apply with:
#   kubectl apply -f session-secret.yaml -n gateway-utility
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: gateway-utility-session
  namespace: gateway-utility
  labels:
    app.kubernetes.io/name: gateway-utility
    app.kubernetes.io/component: session
type: Opaque
data:
  # Replace with:  echo -n "$(openssl rand -hex 32)" | base64
  session-secret: REPLACE_WITH_BASE64_ENCODED_SECRET
